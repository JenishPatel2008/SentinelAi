<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
  <title id="title">Sentinel AI Border Control Unit full pipeline and workflow</title>
  <desc id="desc">End-to-end flow from MP4 and RTSP cameras through OpenCV, YOLO, IoU tracking, face intelligence, zones, behavior, threat scoring, alerts, evidence, SQLite, WebSocket and React dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d16"/>
      <stop offset="1" stop-color="#111d2a"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16304a"/>
      <stop offset="1" stop-color="#20394a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#83bfff"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ffc56d"/>
    </marker>
    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#eef5ff;letter-spacing:1px}
      .subtitle{font:16px 'Segoe UI',Arial,sans-serif;fill:#a9bfd7}
      .section{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#9ecbff;letter-spacing:2px}
      .box-title{font:700 17px 'Segoe UI',Arial,sans-serif;fill:#f2f7ff}
      .box-text{font:14px 'Segoe UI',Arial,sans-serif;fill:#c2d1e3}
      .small{font:12px 'Segoe UI',Arial,sans-serif;fill:#9fb2c8}
      .mono{font:12px 'Cascadia Mono','Consolas',monospace;fill:#b4d6ff}
      .node{fill:#121e2c;stroke:#41617e;stroke-width:2;rx:14;filter:url(#shadow)}
      .source{fill:#14283a;stroke:#55b8d9;stroke-width:2;rx:14;filter:url(#shadow)}
      .ai{fill:#18283a;stroke:#83bfff;stroke-width:2;rx:14;filter:url(#shadow)}
      .intel{fill:#242737;stroke:#bd9aff;stroke-width:2;rx:14;filter:url(#shadow)}
      .security{fill:#34262a;stroke:#ffaaa5;stroke-width:2;rx:14;filter:url(#shadow)}
      .store{fill:#172d2b;stroke:#73d6ad;stroke-width:2;rx:14;filter:url(#shadow)}
      .ui{fill:#202b3b;stroke:#a9c5ff;stroke-width:2;rx:14;filter:url(#shadow)}
      .arrow{fill:none;stroke:#83bfff;stroke-width:3;marker-end:url(#arrow)}
      .arrow-amber{fill:none;stroke:#ffc56d;stroke-width:3;marker-end:url(#arrowAmber)}
      .dash{fill:none;stroke:#7892af;stroke-width:2;stroke-dasharray:8 8}
      .pill{fill:#101a26;stroke:#39536e;stroke-width:1;rx:10}
    </style>
  </defs>

  <rect width="1600" height="2200" fill="url(#bg)"/>
  <path d="M0 0 H1600 V170 H0 Z" fill="url(#header)"/>
  <text x="70" y="72" class="title">SENTINEL AI</text>
  <text x="70" y="112" class="subtitle">Border Control Unit | Full Pipeline and Operational Workflow</text>
  <text x="70" y="145" class="small">Existing detection and tracking pipeline extended with optional face intelligence and protected-zone alarm response</text>

  <text x="70" y="215" class="section">1. CAMERA INPUT AND FRAME PIPELINE</text>
  <rect x="70" y="245" width="320" height="110" class="source"/>
  <text x="100" y="280" class="box-title">MP4 video source</text>
  <text x="100" y="309" class="box-text">Local test or recorded footage</text>
  <text x="100" y="335" class="mono">data/videos/*.mp4</text>
  <rect x="460" y="245" width="320" height="110" class="source"/>
  <text x="490" y="280" class="box-title">RTSP CCTV source</text>
  <text x="490" y="309" class="box-text">Network camera stream</text>
  <text x="490" y="335" class="mono">rtsp://user:pass@host/path</text>
  <rect x="850" y="245" width="320" height="110" class="ai"/>
  <text x="880" y="280" class="box-title">Camera registration</text>
  <text x="880" y="309" class="box-text">Camera manager + source config</text>
  <text x="880" y="335" class="mono">POST /api/cameras</text>
  <rect x="1240" y="245" width="290" height="110" class="node"/>
  <text x="1270" y="280" class="box-title">Stream manager</text>
  <text x="1270" y="309" class="box-text">Start, stop, reconnect</text>
  <text x="1270" y="335" class="mono">OpenCV VideoCapture</text>
  <path d="M390 300 V390 H815 V300 H840" class="arrow"/>
  <path d="M780 300 H840" class="arrow"/>
  <path d="M1170 300 H1230" class="arrow"/>

  <rect x="410" y="415" width="780" height="100" class="ai"/>
  <text x="440" y="450" class="box-title">OpenCV frame manager</text>
  <text x="440" y="480" class="box-text">Reads frames, normalizes source handling, keeps the latest processed frame and stream status</text>
  <text x="440" y="503" class="mono">MP4 and RTSP share the same worker path</text>
  <path d="M1385 355 V390 H800 V405" class="arrow"/>
  <path d="M800 515 V555" class="arrow"/>

  <text x="70" y="590" class="section">2. EXISTING AI DETECTION, TRACKING AND CONTEXT</text>
  <rect x="120" y="625" width="380" height="125" class="ai"/>
  <text x="150" y="662" class="box-title">YOLO detector</text>
  <text x="150" y="692" class="box-text">Person, vehicle and object detections</text>
  <text x="150" y="720" class="mono">ai_models/yolo/model.pt</text>
  <rect x="610" y="625" width="380" height="125" class="ai"/>
  <text x="640" y="662" class="box-title">IoU / centroid tracker</text>
  <text x="640" y="692" class="box-text">Reuses persistent track IDs across frames</text>
  <text x="640" y="720" class="mono">track_id -> person / vehicle state</text>
  <rect x="1100" y="625" width="380" height="125" class="intel"/>
  <text x="1130" y="662" class="box-title">Context enrichment</text>
  <text x="1130" y="692" class="box-text">Vehicle class, ANPR, movement and scene</text>
  <text x="1130" y="720" class="mono">night / low-light / plate metadata</text>
  <path d="M800 555 V605 H310 V615" class="arrow"/>
  <path d="M500 687 H600" class="arrow"/>
  <path d="M990 687 H1090" class="arrow"/>

  <rect x="280" y="805" width="1040" height="125" class="intel"/>
  <text x="315" y="842" class="box-title">Zone and scene evaluation</text>
  <text x="315" y="872" class="box-text">Normalized polygon membership, restricted-zone crossing, night detection, dwell time and behavioral state</text>
  <text x="315" y="903" class="mono">OPEN | MONITORED | PROTECTED   +   loitering / stationary / fence / proximity</text>
  <path d="M1290 750 V785 H800 V795" class="arrow"/>

  <text x="70" y="1005" class="section">3. FACE INTELLIGENCE ON EXISTING PERSON TRACKS</text>
  <rect x="90" y="1040" width="330" height="135" class="ai"/>
  <text x="120" y="1077" class="box-title">Person crop</text>
  <text x="120" y="1107" class="box-text">Face processing is limited to</text>
  <text x="120" y="1130" class="box-text">existing person bounding boxes</text>
  <text x="120" y="1157" class="mono">track_id preserved</text>
  <rect x="475" y="1040" width="330" height="135" class="ai"/>
  <text x="505" y="1077" class="box-title">Face detection</text>
  <text x="505" y="1107" class="box-text">YuNet when installed, Haar fallback</text>
  <text x="505" y="1130" class="box-text">bbox + confidence + association</text>
  <text x="505" y="1157" class="mono">FACE_DETECTED / OBSTRUCTED</text>
  <rect x="860" y="1040" width="300" height="135" class="ai"/>
  <text x="890" y="1077" class="box-title">Quality gate</text>
  <text x="890" y="1107" class="box-text">Size, blur and brightness checks</text>
  <text x="890" y="1130" class="box-text">Poor quality is not forced to match</text>
  <text x="890" y="1157" class="mono">usable / unavailable</text>
  <rect x="1215" y="1040" width="300" height="135" class="intel"/>
  <text x="1245" y="1077" class="box-title">Optional recognition</text>
  <text x="1245" y="1107" class="box-text">SFace embeddings + cosine similarity</text>
  <text x="1245" y="1130" class="box-text">Disabled safely when not configured</text>
  <text x="1245" y="1157" class="mono">known / unknown / unverified</text>
  <path d="M800 930 V985 H255 V1030" class="arrow"/>
  <path d="M420 1107 H465" class="arrow"/>
  <path d="M805 1107 H850" class="arrow"/>
  <path d="M1160 1107 H1205" class="arrow"/>

  <rect x="290" y="1230" width="1020" height="125" class="intel"/>
  <text x="325" y="1267" class="box-title">Identity stabilization and policy context</text>
  <text x="325" y="1297" class="box-text">Track-level sampling, multi-frame confirmation, identity persistence and separate state per person</text>
  <text x="325" y="1327" class="mono">3-frame confirmation | trusted subject | category | watchlist match | unknown is valid</text>
  <path d="M1365 1175 V1210 H800 V1220" class="arrow"/>

  <text x="70" y="1430" class="section">4. THREAT, RESPONSE AND PERSISTENCE</text>
  <rect x="100" y="1465" width="350" height="145" class="security"/>
  <text x="130" y="1502" class="box-title">Deterministic threat engine</text>
  <text x="130" y="1532" class="box-text">Combines zone, behavior, night and identity context</text>
  <text x="130" y="1558" class="box-text">Identity alone is never a threat</text>
  <text x="130" y="1588" class="mono">score -> severity -> reasons</text>
  <rect x="510" y="1465" width="350" height="145" class="security"/>
  <text x="540" y="1502" class="box-title">Protected-zone decision</text>
  <text x="540" y="1532" class="box-text">OPEN / MONITORED preserve normal policy</text>
  <text x="540" y="1558" class="box-text">PROTECTED requires trusted identity</text>
  <text x="540" y="1588" class="mono">unverified -> intrusion alarm</text>
  <rect x="920" y="1465" width="260" height="145" class="security"/>
  <text x="950" y="1502" class="box-title">Alert service</text>
  <text x="950" y="1532" class="box-text">Alert + event + evidence</text>
  <text x="950" y="1558" class="box-text">cooldown prevents spam</text>
  <text x="950" y="1588" class="mono">active / confirmed / declined</text>
  <rect x="1240" y="1465" width="280" height="145" class="security"/>
  <text x="1270" y="1502" class="box-title">Alarm and incident</text>
  <text x="1270" y="1532" class="box-text">Backend alarm state + incident record</text>
  <text x="1270" y="1558" class="box-text">Silencing does not resolve incident</text>
  <text x="1270" y="1588" class="mono">ack / silence / resolve</text>
  <path d="M800 1355 V1410 H275 V1455" class="arrow-amber"/>
  <path d="M450 1537 H500" class="arrow-amber"/>
  <path d="M860 1537 H910" class="arrow-amber"/>
  <path d="M1180 1537 H1230" class="arrow-amber"/>

  <rect x="150" y="1675" width="390" height="145" class="store"/>
  <text x="180" y="1712" class="box-title">SQLite persistence</text>
  <text x="180" y="1742" class="box-text">Detections, tracks, events, alerts</text>
  <text x="180" y="1768" class="box-text">Face observations, subjects and incidents</text>
  <text x="180" y="1798" class="mono">sentinel.db | embeddings not exposed by API</text>
  <rect x="605" y="1675" width="390" height="145" class="store"/>
  <text x="635" y="1712" class="box-title">Evidence storage</text>
  <text x="635" y="1742" class="box-text">Annotated alert and event snapshots</text>
  <text x="635" y="1768" class="box-text">Served through the evidence endpoint</text>
  <text x="635" y="1798" class="mono">data/evidence/</text>
  <rect x="1060" y="1675" width="390" height="145" class="store"/>
  <text x="1090" y="1712" class="box-title">WebSocket manager</text>
  <text x="1090" y="1742" class="box-text">scene, alert, alarm, ANPR and event updates</text>
  <text x="1090" y="1768" class="box-text">Pushes live state to connected operators</text>
  <text x="1090" y="1798" class="mono">/api/ws?token=...</text>
  <path d="M275 1610 V1665" class="arrow"/>
  <path d="M1050 1537 V1600 H800 V1665" class="arrow"/>
  <path d="M1380 1610 V1665" class="arrow"/>
  <path d="M450 1747 H595" class="dash"/>
  <path d="M995 1747 H1050" class="dash"/>

  <text x="70" y="1895" class="section">5. REACT OPERATOR WORKFLOW</text>
  <rect x="80" y="1930" width="330" height="135" class="ui"/>
  <text x="110" y="1967" class="box-title">Live Monitoring</text>
  <text x="110" y="1997" class="box-text">LivePreview + track IDs + face state</text>
  <text x="110" y="2023" class="box-text">Camera selection and stream controls</text>
  <text x="110" y="2050" class="mono">/monitoring</text>
  <rect x="455" y="1930" width="330" height="135" class="ui"/>
  <text x="485" y="1967" class="box-title">Alert notification</text>
  <text x="485" y="1997" class="box-text">Popup shows person, camera and details</text>
  <text x="485" y="2023" class="box-text">Click opens review and evidence page</text>
  <text x="485" y="2050" class="mono">confirm -> laptop alarm audio</text>
  <rect x="830" y="1930" width="330" height="135" class="ui"/>
  <text x="860" y="1967" class="box-title">Response pages</text>
  <text x="860" y="1997" class="box-text">Alerts, Incidents and Trusted Persons</text>
  <text x="860" y="2023" class="box-text">Acknowledge, silence, resolve, manage</text>
  <text x="860" y="2050" class="mono">/alerts | /incidents | /trusted-persons</text>
  <rect x="1205" y="1930" width="315" height="135" class="ui"/>
  <text x="1235" y="1967" class="box-title">Operations and settings</text>
  <text x="1235" y="1997" class="box-text">Cameras, zones, analytics, settings</text>
  <text x="1235" y="2023" class="box-text">Face recognition remains optional</text>
  <text x="1235" y="2050" class="mono">/cameras | /analytics | /settings</text>
  <path d="M1255 1819 V1885 H245 V1920" class="arrow"/>
  <path d="M1255 1819 V1875 H620 V1920" class="arrow"/>
  <path d="M1255 1819 V1865 H995 V1920" class="arrow"/>
  <path d="M1255 1819 V1855 H1360 V1920" class="arrow"/>

  <rect x="80" y="2110" width="1440" height="54" class="pill"/>
  <circle cx="110" cy="2137" r="8" fill="#55b8d9"/><text x="130" y="2142" class="small">Input / stream</text>
  <circle cx="330" cy="2137" r="8" fill="#83bfff"/><text x="350" y="2142" class="small">AI processing</text>
  <circle cx="550" cy="2137" r="8" fill="#bd9aff"/><text x="570" y="2142" class="small">Context and identity</text>
  <circle cx="820" cy="2137" r="8" fill="#ffaaa5"/><text x="840" y="2142" class="small">Threat and response</text>
  <circle cx="1090" cy="2137" r="8" fill="#73d6ad"/><text x="1110" y="2142" class="small">Storage and delivery</text>
  <circle cx="1350" cy="2137" r="8" fill="#a9c5ff"/><text x="1370" y="2142" class="small">React UI</text>
</svg>
